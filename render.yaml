services:
  - type: web
    name: eko-nights-tickets
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.asgi:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: STORE_BACKEND
        value: sheets
      - key: PAYSTACK_MODE
        value: paystack
      - key: HOLD_MINUTES
        value: "15"
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: STAFF_PIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
